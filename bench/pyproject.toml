[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "treejit-bench"
version = "0.1.0"
description = "Learning-curve benchmark for treejit: a synthetic workflow suite driven by a simulated agent, proxy on vs off."
requires-python = ">=3.10"
dependencies = ["treejit"]

[project.optional-dependencies]
proxy = ["treejit[proxy]"]

[tool.setuptools.packages.find]
where = ["src"]
